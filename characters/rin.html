<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>رين — العرش المكسور</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <main>

        <section class="hero">

            <h1>رين</h1>

            <p class="subtitle">
                شخصية من عالم العرش المكسور
            </p>

        </section>

        <section class="about">

            <div class="character-profile">

                <div class="character-image">
                    <img src="../assets/images/rin.jpg" alt="رين">
                </div>

                <div class="character-info">

                    <h2>رين</h2>

                    <p class="character-title">
                        البطل
                    </p>

                    <p>
                        شخصية رئيسية في أحداث رواية العرش المكسور،
                        وترتبط قصته بأحداث ستغير مجرى العالم.
                    </p>

                    <div class="character-details">

                        <p>
                            <strong>الاسم:</strong>
                            رين
                        </p>

                        <p>
                            <strong>الصفة:</strong>
                            البطل
                        </p>

                        <p>
                            <strong>الظهور:</strong>
                            الفصل الأول
                        </p>

                    </div>

                </div>

            </div>

            <div class="character-spoiler-section">

                <h2>معلومات الشخصية</h2>

                <div class="spoiler-info show">

                    <p>
                        هذه المعلومات مخصصة للقراء الذين يريدون معرفة تفاصيل
                        إضافية عن شخصية رين.
                    </p>

                </div>

            </div>

            <div class="character-back">

                <a href="index.html">
                    العودة إلى الشخصيات
                </a>

            </div>

        </section>

    </main>

    <script src="../script.js"></script>

</body>

</html>
