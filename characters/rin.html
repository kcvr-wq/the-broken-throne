<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>رين — العرش المكسور</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

<main>

    <section class="hero">

        <h1>رين</h1>

        <p class="subtitle">

    <section class="about">

        <div class="character-profile">

            <div class="character-image">
                <img src="../assets/images/rin.jpg" alt="رين">
            </div>

            <div class="character-info">

                <h2>رين</h2>

                <p class="character-title">

                <p>

                <div class="character-details">

                    </p>

                    <p>

                    </p>

                    <p>

                        البطل
                    </p>

                    <p>

            <button class="spoiler-button" type="button">

            <div class="spoiler-info">

                <p>

                    وُلد رين وهو يمتلك عدة مهارات وقدرات مميزة، ظهرت معه منذ ولادته.
